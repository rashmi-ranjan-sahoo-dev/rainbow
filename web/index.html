<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rainbow Eye Hospital — AIIMS-trained eye surgeons, 100% blade-free Contoura LASIK, micro-cataract surgery &amp; comprehensive ocular care in Visakhapatnam.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rainbow Eye Hospital">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"/>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2"/>
  <link rel="shortcut icon" href="favicon.png?v=2"/>

  <script>
    (function() {
      const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
      link.type = 'image/png';
      link.rel = 'shortcut icon';
      link.href = 'favicon.png?v=' + Date.now();
      document.head.appendChild(link);
    })();
  </script>

  <title>Rainbow Eye Hospital | Advanced Vision Care & Laser Center</title>
  <link rel="manifest" href="manifest.json?v=2">
  <style>
    body { margin: 0; background-color: #070B14; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
